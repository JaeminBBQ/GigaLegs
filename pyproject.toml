[project]
name = "gigalegs"
version = "0.1.0"
description = "Gamified, evidence-based leg training coach"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.scripts]
gigalegs = "gigalegs.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gigalegs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"src/gigalegs/web/app.py" = ["B008"]  # FastAPI Depends()/Form() defaults are the idiom
"migrations/*" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
